[project]
name = "cwbdatasiac"
version = "0.1.0"
description = "Pipeline de engenharia de dados sobre os dados abertos do SIAC 156 de Curitiba"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Melsar José Dal Ri Filho", email = "melsar.filho@gmail.com" }]
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pandera[pandas]>=0.34.1",
    "pyarrow>=26.0.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[project.scripts]
cwbdatasiac = "cwbdatasiac.cli:app"

[project.optional-dependencies]
browser = [
    "playwright>=1.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]
explore = [
    "duckdb>=2.0.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# O notebook de exploração é um registro de análise, não código de produção.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cwbdatasiac --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["cwbdatasiac"]

[tool.coverage.report]
fail_under = 80
show_missing = true
